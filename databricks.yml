bundle:
  name: blackbaud_fundraising_intelligence

artifacts:
  default:
    type: whl
    build: uv run hatch build
    path: .

include:
  - resources/**/*.yml

variables:
  whl_version:
    default: "0.1.0"
  whl_path:
    default: "${workspace.root_path}/artifacts/.internal/${bundle.name}-${var.whl_version}-py3-none-any.whl"
  source_catalog:
    default: "blackbaud_nxt_test"
  gold_catalog:
    default: "blackbaud_demo_bbcon"
  gold_schema:
    default: "default"
  prod_sp_name:
    description: >-
      Application ID of the service principal that runs prod jobs and owns the
      prod deploy. Pinning run_as to an SP means scheduled refreshes don't depend
      on any individual user's session or federation binding.
    # SETUP TODO: replace with the real prod service principal application ID.
    default: "00000000-0000-0000-0000-000000000000"

targets:
  dev:
    mode: development
    default: true
    # Dev deploys run as the interactive user. FEVM Azure workspaces don't support
    # PAT/SP deploys for the FE team, so dev stays user-run; prod should use the SP below.
    workspace:
      host: https://adb-7405614847929963.3.azuredatabricks.net
      root_path: ~/bundles/${bundle.name}

